<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="e-education（兵庫県豊岡市）のレッスン予約ページの見本です。実際の予約は入りません。">
  <meta name="theme-color" content="#1f3a5f">
  <title>e-education レッスン予約（見本）</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 全画面に出す「見本です」のお知らせ -->
  <p class="demo-notice" id="demo-notice"></p>

  <header class="site-header">
    <p class="site-name" id="site-name"></p>
    <!-- お客さん側と教室側の切り替え（見本なのでログインはなし） -->
    <nav class="mode-switch" aria-label="画面の切り替え">
      <button type="button" class="mode-btn" data-action="mode-customer" id="mode-customer">お客さん側</button>
      <button type="button" class="mode-btn" data-action="mode-admin" id="mode-admin">教室側</button>
      <span class="mode-note">見本のため誰でも見られます</span>
    </nav>
  </header>

  <div class="layout">
    <!-- 画面はここに js/app.js が描く -->
    <main class="page" id="app"></main>
    <!-- 選んだ内容と金額・時間（スマホは下に固定の帯、パソコンは右側） -->
    <aside class="summary" id="summary" aria-label="選んだ内容" hidden></aside>
  </div>

  <!-- お店向けの見本への小さな案内（トップの画面にだけ出す。css/style.css の .site-footer） -->
  <footer class="site-footer">
    <p><a href="shop/">お店向けの予約ページの見本もあります（飲食店・サロン）</a></p>
  </footer>

  <!-- 読みこむ順番に意味がある：データ → 計算 → 保存 → 書き方 → 教室側の画面 → 画面全体 -->
  <script src="js/data.js"></script>
  <script src="js/availability.js"></script>
  <script src="js/price.js"></script>
  <script src="js/store.js"></script>
  <script src="js/format.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
