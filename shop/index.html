<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="description" content="但馬の小さなお店向けの予約ページの見本です。実際の予約は入りません。">
  <title>お店向け予約ページ（見本）</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-color="navy">
  <!-- 全画面に出す「見本です」のお知らせ -->
  <p class="demo-notice" id="demo-notice"></p>

  <header class="site-header">
    <p class="site-name" id="site-name">お店向け予約ページ（見本）</p>
    <!-- 見本のお店の切り替え -->
    <nav class="mode-switch" id="shop-switch" aria-label="見本のお店の切り替え"></nav>
    <!-- お客さん側とお店側の切り替え（見本なのでログインはなし） -->
    <nav class="mode-switch" aria-label="画面の切り替え">
      <button type="button" class="mode-btn" data-action="mode-customer" id="mode-customer">お客さん側</button>
      <button type="button" class="mode-btn" data-action="mode-admin" id="mode-admin">お店側</button>
      <span class="mode-note">見本のため誰でも見られます</span>
    </nav>
  </header>

  <div class="layout">
    <!-- 画面はここに js/app.js が描く -->
    <main class="page" id="app"></main>
    <!-- 選んだ内容と料金・時間（スマホは下に固定の帯、パソコンは右側） -->
    <aside class="summary" id="summary" aria-label="選んだ内容" hidden></aside>
  </div>

  <!-- 読みこむ順番に意味がある：お店の設定 → 計算 → 金額 → 書き方 → 保存 → 設定の確かめ → お店側の画面 → 画面全体 -->
  <script src="js/shops.js"></script>
  <script src="js/availability.js"></script>
  <script src="js/price.js"></script>
  <script src="js/format.js"></script>
  <script src="js/store.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
